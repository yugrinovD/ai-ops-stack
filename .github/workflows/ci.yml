name: ci

on:
  push:
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local config
        run: |
          cp .env.example .env
          ./scripts/init-env.sh
      - name: Validate Compose
        run: docker compose config -q
      - name: Check shell scripts
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
